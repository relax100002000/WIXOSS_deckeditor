<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>WIXOSS Deck Editor (Simple)</title>
<style>
	* { box-sizing: border-box; font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", "Microsoft JhengHei", sans-serif; font-size: 14px; }
	body { margin: 0; background: #eef0f5; color: #222; height: 100vh; display: flex; flex-direction: column; }
	header { background: #1f2a44; color: #fff; padding: 6px 12px; display: flex; align-items: center; gap: 12px; }
	header h1 { font-size: 17px; margin: 0; }
	header .ver { margin-left: auto; font-size: 12px; opacity: .7; }
	main { flex: 1; display: flex; min-height: 0; }
	#left { flex: 1; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid #ccd; }
	#right { width: 460px; display: flex; flex-direction: column; background: #fff; overflow-y: auto; }
	#filters { background: #fff; padding: 8px 10px; border-bottom: 1px solid #ccd; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
	#filters input[type=text] { width: 190px; padding: 4px 6px; }
	select, input, button { padding: 3px 6px; }
	button { cursor: pointer; border: 1px solid #99a; background: #f6f7fb; border-radius: 4px; }
	button:hover { background: #e6e9f5; }
	.chip { display: inline-block; min-width: 26px; text-align: center; padding: 2px 7px; margin: 0 2px; border: 1px solid #99a; border-radius: 12px; cursor: pointer; user-select: none; background: #fff; }
	.chip.on { background: #1f2a44; color: #fff; border-color: #1f2a44; }
	.chip.colchip.on.cw { background: #c9bf6a; border-color: #c9bf6a; color: #222; }
	.chip.colchip.on.cb { background: #2b84d6; border-color: #2b84d6; }
	.chip.colchip.on.cz { background: #333; border-color: #333; }
	.chip.colchip.on.cr { background: #d9432b; border-color: #d9432b; }
	.chip.colchip.on.cg { background: #2f9d4a; border-color: #2f9d4a; }
	.chip.colchip.on.cn { background: #888; border-color: #888; }
	#scroller { flex: 1; overflow-y: auto; padding: 8px; }
	#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
	.card { position: relative; cursor: pointer; border-radius: 8px; background: #dde; }
	.card img { width: 100%; display: block; border-radius: 8px; aspect-ratio: 360/504; object-fit: cover; }
.card img.land { aspect-ratio: auto; object-fit: contain; }
	#bigImg.land { width: 294px; height: 210px; }
	.vthumb.land { height: 46px; }
	.card:hover { outline: 3px solid #3b6fe0; }
	.badge { position: absolute; right: 4px; bottom: 4px; background: #e8433a; color: #fff; font-weight: bold; border-radius: 10px; min-width: 22px; text-align: center; padding: 1px 6px; box-shadow: 0 0 3px #000; }
	#moreWrap { text-align: center; padding: 10px; }
	#preview { padding: 10px; display: flex; gap: 10px; border-bottom: 1px solid #ccd; height: 320px; flex-shrink: 0; overflow: hidden; }
	#bigImg { width: 210px; height: 294px; border-radius: 10px; cursor: pointer; background: #dde; flex-shrink: 0; }
	#pinfo { flex: 1; min-width: 0; font-size: 13px; height: 100%; overflow-y: auto; }
	.pname { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
	.ptext { margin: 6px 0; padding: 6px; background: #f4f5fa; border-radius: 6px; line-height: 1.5; }
	.ptext.tw { background: #eef6ee; }
	.twh { font-size: 11px; color: #4a7; margin-bottom: 2px; }
	.pflavor { color: #667; font-style: italic; font-size: 12px; }
	.pmeta { color: #667; font-size: 12px; margin-top: 4px; }
	.pwarn { color: #c33; font-weight: bold; margin-top: 4px; }
	#variants { padding: 4px 10px; display: flex; gap: 4px; overflow-x: auto; height: 76px; flex-shrink: 0; }
	.vthumb { height: 64px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
	.vthumb.sel { border-color: #3b6fe0; }
	.dot { display: inline-block; padding: 0 6px; border-radius: 10px; color: #fff; font-size: 12px; margin-right: 2px; }
	.dot.s { padding: 0; width: 10px; height: 10px; vertical-align: middle; }
	.cw { background: #e8e2b0; color: #222; } .cb { background: #2b84d6; } .cz { background: #333; }
	.cr { background: #d9432b; } .cg { background: #2f9d4a; } .cn { background: #888; }
	.lbmark { background: #e0409a; color: #fff; font-size: 10px; border-radius: 4px; padding: 0 3px; margin-right: 2px; }
	#deckBar { padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-bottom: 1px solid #ccd; }
	#deckBar input[type=text] { width: 140px; }
	#codeBox { width: 100%; margin: 4px 10px 0; width: calc(100% - 20px); }
	.zone { padding: 6px 10px 2px; font-weight: bold; display: flex; justify-content: space-between; }
	.zone .ok { color: #1c8a3a; } .zone .bad { color: #d22; }
	.drow { display: flex; align-items: center; gap: 4px; padding: 2px 10px; cursor: pointer; }
	.drow:hover { background: #eef2ff; }
	.dcost { width: 22px; text-align: right; color: #667; }
	.dname { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-left: 4px; }
	.dn { width: 22px; text-align: center; font-weight: bold; }
	.mini { padding: 0 6px; line-height: 18px; }
	.empty { color: #889; padding: 6px 10px; }
	#stats { padding: 8px 10px; border-top: 1px solid #ccd; margin-top: auto; }
	.curve { display: flex; gap: 4px; align-items: flex-end; height: 96px; }
	.bar { flex: 1; text-align: center; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
	.barf { width: 100%; background: #3b6fe0; border-radius: 3px 3px 0 0; min-height: 1px; }
	.barv, .barl { font-size: 11px; color: #667; }
	.civsum { margin-top: 4px; }
	#msg { position: fixed; left: 50%; top: 56px; transform: translateX(-50%); background: #222c; color: #fff; padding: 6px 16px; border-radius: 16px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9; }
	@media (max-width: 900px) { main { flex-direction: column; overflow-y: auto; } #right { width: 100%; } #left { min-height: 70vh; } }
</style>
<script>
	// 橫向卡(ピース等)自動偵測: 圖片載入後若寬>高,加上 .land 以橫向顯示
	document.addEventListener('load', function (e) {
		var t = e.target;
		if (t && t.tagName === 'IMG' && t.naturalWidth) t.classList.toggle('land', t.naturalWidth > t.naturalHeight);
	}, true);
</script>
<script>
	// 防快取: 每次載入都重新讀取 JS
	(function () {
		var v = '?v=' + Date.now();
		document.write('<script src="js/card_info.js' + v + '"><\/script>');
		document.write('<script src="js/same_name.js' + v + '"><\/script>');
		document.write('<script src="js/same_name_extra.js' + v + '"><\/script>');
		document.write('<script src="js/simple.js' + v + '"><\/script>');
	})();
</script>
</head>
<body>
<header>
	<h1>WIXOSS Deck Editor (Simple)</h1>
	<span>左鍵加入 / 右鍵減少 / 按住 Alt 鎖定預覽</span><a href="index.html" style="color:#9bf">完整版</a>
	<span class="ver" id="ver"></span>
</header>
<main>
	<section id="left">
		<div id="filters">
			<input type="text" id="fWord" placeholder="關鍵字(卡名/類別/效果/中文)">
			<span id="colChips"></span>
			<select id="fColMode"><option value="any">含任一顏色</option><option value="mono">單色</option><option value="multi">多色</option></select>
			<span id="lvChips"></span>
			<select id="fType"><option value="">種類:全部</option></select>
			<select id="fClass"><option value="">クラス:全部</option></select>
			<select id="fProd"><option value="">商品:全部</option></select>
			<select id="fLB"><option value="">LB:全部</option><option value="1">LB有り</option><option value="0">LBなし</option></select>
			<select id="fSort"><option value="level">レベル順</option><option value="name">名稱</option><option value="new">新卡優先(ID)</option></select>
			<label><input type="checkbox" id="fInDeck">只看牌組內</label>
			<button onclick="resetFilter()">重置</button>
			<span id="resultNum" style="color:#667"></span>
		</div>
		<div id="scroller">
			<div id="grid"></div>
			<div id="moreWrap"><button id="moreBtn">顯示更多</button></div>
		</div>
	</section>
	<aside id="right">
		<div id="preview">
			<img id="bigImg" referrerpolicy="no-referrer" alt="" src="">
			<div id="pinfo"><div class="empty">滑鼠移到卡片上預覽</div></div>
		</div>
		<div id="variants"></div>
		<div id="deckBar">
			<input type="text" id="deckName" placeholder="牌組名稱">
			<button onclick="saveDeck()">儲存</button>
			<select id="deckSel" onchange="loadDeck()"></select>
			<button onclick="deleteDeck()">刪除</button>
			<button onclick="clearDeck()">清空</button>
			<button onclick="exportCode()">匯出文字</button>
			<button onclick="importCode()">匯入</button>
			
		</div>
		<textarea id="codeBox" rows="3" placeholder="牌組文字(與完整版 Deck 文字格式相同;匯入時貼在這裡再按「匯入」)"></textarea>
		<div id="deckBox"></div>
		<div id="stats"></div>
	</aside>
</main>
<div id="msg"></div>
</body>
</html>
