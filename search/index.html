<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b3fe4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WX Search">
<title>WIXOSS カード検索</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<body>
<div class="topbar">
  <div class="row1">
    <div class="title">WIXOSS 卡片搜尋<small id="ver"></small></div>
    <div class="seg" id="langSeg"><button data-lang="JP">JP</button><button data-lang="TW">TW</button></div>
    <button class="iconbtn" id="themeBtn" title="Theme">◐</button>
  </div>
  <div class="row2">
    <div class="searchbox" id="searchbox">
      <span>🔍</span>
      <input type="search" id="textsearch" placeholder="カード名・テキスト・ID…" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clearText" aria-label="clear">✕</button>
    </div>
    <button class="iconbtn" id="filterBtn" title="Filter">⚙<span class="badge" id="filterBadge" hidden></span></button>
  </div>
  <div class="meta"><span id="count">讀取中…</span><button id="installBtn">安裝 App</button></div>
</div>

<main id="grid"></main>
<div id="sentinel"></div>

<!-- filter sheet -->
<section class="sheet" id="filterSheet">
  <header><button class="iconbtn" data-close>✕</button><h2>搜尋條件</h2></header>
  <div class="body">
    <div class="fgroup"><h3>カード種類</h3><div class="chips">
      <label class="chip"><input type="checkbox" id="lrig" checked><span>ルリグ</span></label>
      <label class="chip"><input type="checkbox" id="assistlrig" checked><span>アシストルリグ</span></label>
      <label class="chip"><input type="checkbox" id="piece" checked><span>ピース</span></label>
      <label class="chip"><input type="checkbox" id="arts" checked><span>アーツ</span></label>
      <label class="chip"><input type="checkbox" id="signi" checked><span>シグニ</span></label>
      <label class="chip"><input type="checkbox" id="spell" checked><span>スペル</span></label>
    </div></div>
    <div class="fgroup"><h3>レベル</h3><div class="chips">
      <label class="chip"><input type="checkbox" id="level0" checked><span>0</span></label>
      <label class="chip"><input type="checkbox" id="level1" checked><span>1</span></label>
      <label class="chip"><input type="checkbox" id="level2" checked><span>2</span></label>
      <label class="chip"><input type="checkbox" id="level3" checked><span>3</span></label>
      <label class="chip"><input type="checkbox" id="level4" checked><span>4</span></label>
    </div></div>
    <div class="fgroup"><h3>色</h3><div class="chips">
      <label class="chip c-white"><input type="checkbox" id="white" checked><span>白</span></label>
      <label class="chip c-red"><input type="checkbox" id="red" checked><span>赤</span></label>
      <label class="chip c-blue"><input type="checkbox" id="blue" checked><span>青</span></label>
      <label class="chip c-green"><input type="checkbox" id="green" checked><span>緑</span></label>
      <label class="chip c-black"><input type="checkbox" id="black" checked><span>黒</span></label>
      <label class="chip c-none"><input type="checkbox" id="nocolor" checked><span>無</span></label>
    </div>
    <div class="coloropts">
      <div class="seg small" id="colorModeSeg"><span class="seglabel">顏色比對</span><button data-mode="any">任一</button><button data-mode="all">全部</button></div>
      <label class="chip"><input type="checkbox" id="monocolor" checked><span>単色</span></label>

    <div class="note" id="colorHint"></div></div>
    <div class="fgroup"><h3>使用タイミング（アシスト／ピース／アーツ）</h3><div class="chips">
      <label class="chip"><input type="checkbox" id="mainphase" checked><span>メインフェイズ</span></label>

      <label class="chip"><input type="checkbox" id="spellcutin" checked><span>スペルカットイン</span></label>
