<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGNI 語源圖鑑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 窄版圖鑑 — 頂部標題＋黏性篩選列，下方是逐張卡片的條目清單，點開看細節 */
:root{
  --bg:#f2f0f5; --surface:#ffffff; --sunk:#e9e6ef; --fg:#1c1926; --muted:#655f78; --line:#d9d4e3;
  --accent:#a8204f; --accent-soft:#f6dde6; --on-accent:#ffffff;
  --hi:#1f7a4c; --hi-bg:#dcefe4; --mid:#9a6a00; --mid-bg:#f6ecd2; --lo:#b03a2e; --lo-bg:#f6dedb;
  --c-white:#efeadb; --c-red:#d33b3b; --c-blue:#2f6ed4; --c-green:#2e9658; --c-black:#3a3247; --c-none:#a29db0;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131c; --surface:#1e1b28; --sunk:#26222f; --fg:#ece8f4; --muted:#a39db6; --line:#353046;
  --accent:#ec6c97; --accent-soft:#3a1f2b; --on-accent:#1a0c12;
  --hi:#6fd39d; --hi-bg:#163024; --mid:#e8b84a; --mid-bg:#33290f; --lo:#f08679; --lo-bg:#3a1c19;
  --c-white:#d9d3c2; --c-black:#0b0a10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131c; --surface:#1e1b28; --sunk:#26222f; --fg:#ece8f4; --muted:#a39db6; --line:#353046;
  --accent:#ec6c97; --accent-soft:#3a1f2b; --on-accent:#1a0c12;
  --hi:#6fd39d; --hi-bg:#163024; --mid:#e8b84a; --mid-bg:#33290f; --lo:#f08679; --lo-bg:#3a1c19;
  --c-white:#d9d3c2; --c-black:#0b0a10; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,5vw,42px);line-height:1.15;margin:6px 0 8px;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line)}
.bar .wrap{padding-block:12px;display:grid;gap:10px}
.row1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:640px){.row1{grid-template-columns:1fr 1fr}.row1 .q{grid-column:1/-1}}
label.f{display:grid;gap:2px;min-width:0}
label.f span{font-size:11px;letter-spacing:.08em;color:var(--muted)}
input,select{font:inherit;font-size:14px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips b{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--muted);margin-right:2px}
button.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pip{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;font-size:13px;color:var(--muted)}
.status strong{font-family:var(--mono);font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.reset{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
main.wrap{padding-block:14px 48px}
ol.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-columns:6px auto minmax(0,1fr);gap:0 16px;padding-right:16px}
.stripe{align-self:stretch}
.thumb{width:192px;aspect-ratio:869/1213;max-width:100%;border-radius:6px;background:var(--sunk);object-fit:cover;align-self:start;margin-block:12px}
.imgfb{display:block;margin-block:12px;font-size:12.5px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.info{min-width:0;padding-block:12px;display:grid;gap:6px;align-content:start}
.head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.name{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.name .pre{color:var(--muted);font-weight:600;margin-right:.35em}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);align-items:center}
.meta .id{font-family:var(--mono)}
.cls{background:var(--sunk);border-radius:4px;padding:0 6px;color:var(--fg)}
.ety{font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.ety .orig{display:block;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.conf{font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap;flex:none}
.conf.高{color:var(--hi);background:var(--hi-bg)} .conf.中{color:var(--mid);background:var(--mid-bg)} .conf.低{color:var(--lo);background:var(--lo-bg)}
.detail{border-top:1px dashed var(--line);padding-top:8px;margin:2px 0 0;display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:4px 12px;font-size:13.5px}
.detail dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
.detail a{color:var(--accent);text-underline-offset:3px}
@media (max-width:640px){.thumb{width:120px}}
@media (max-width:460px){.card{grid-template-columns:6px minmax(0,1fr);padding-right:14px}.stripe{grid-row:1/span 2}.thumb{grid-column:2;width:min(160px,60%);margin-bottom:0}.info{grid-column:2}.detail{grid-template-columns:1fr}.detail dt{padding-top:4px}}
.more{display:flex;justify-content:center;padding-top:16px}
.more button{font:inherit;background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:9px 22px;cursor:pointer;font-weight:500}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
footer{color:var(--muted);font-size:12.5px;padding-top:24px}
details.rules{margin-top:14px;font-size:14px}
details.rules summary{display:inline;padding:0;color:var(--accent);font-size:13px}
details.rules dl{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:6px 14px;margin:10px 0 0;max-width:80ch}
details.rules dt{font-weight:700;font-size:13px} details.rules dd{margin:0;color:var(--muted)}
@media (max-width:520px){details.rules dl{grid-template-columns:1fr}}

body{margin:0}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="eyebrow">WIXOSS · SIGNI NAME ORIGINS</div>
  <h1>SIGNI 語源圖鑑</h1>
  <p class="lede">收錄 <span id="total">1582</span> 張 Diva 世代以後的 SIGNI。可以用彈數、種族、顏色或關鍵字找卡，每張卡都列出前綴拆解、原詞與判斷依據；點卡圖可開啟官網原圖。</p>
  <details class="rules"><summary>命名規則速查</summary><dl id="rules"></dl></details>
</div></header>
<div class="bar"><div class="wrap">
  <div class="row1">
    <label class="f q"><span>關鍵字</span><input id="q" type="search" placeholder="卡名、語源、原詞，例如：天使、Tobiel、ガリレオ" autocomplete="off"></label>
    <label class="f"><span>彈數</span><select id="set"></select></label>
    <label class="f"><span>種族</span><select id="cls"></select></label>
  </div>
  <div class="row2">
    <div class="chips" id="colors"><b>顏色</b></div>
    <div class="chips" id="confs"><b>可信度</b></div>
  </div>
  <div class="status"><span>符合 <strong id="count">0</strong> 張 · <span id="breakdown"></span></span><button class="reset" id="reset" type="button">清除篩選</button></div>
</div></div>
<main class="wrap">
  <ol class="list" id="list"></ol>
  <div class="empty" id="empty" hidden>沒有符合的卡片。試著放寬條件，或按「清除篩選」。</div>
  <div class="more" id="more" hidden><button type="button" id="moreBtn">再顯示</button></div>
  <footer>資料來源：SIGNI_命名語源推測.xlsx。可信度「高」代表卡名、卡圖或風味文字可佐證；「中」「低」為推測，歡迎補充。卡圖直接讀取 Takara Tomy 官網圖片；若環境無法連線官網，會自動隱藏縮圖、只保留連結。</footer>
</main>

GNI 名稱統計歸納；「本名語源」為 AI 推測，可信度欄標「低」者請人工確認。聯名卡只標註來源作品。"]]};
const R=DATA.rows;
function imgFb(img){const t=document.createElement('span');t.className='imgfb';t.textContent='開啟官網卡圖';img.replaceWith(t)}
function imgFail(){if(!document.body.classList.contains('noimg')){document.body.classList.add('noimg')}} const $=id=>document.getElementById(id);
const COL={'白':'--c-white','赤':'--c-red','青':'--c-blue','緑':'--c-green','黒':'--c-black','無':'--c-none'};
const colorsOf=s=>[...s].filter(ch=>COL[ch]);
$('total').textContent=R.length;
$('rules').innerHTML=DATA.rules.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// 彈數下拉：依世代分組
const gen=s=>s.startsWith('WXDi')?'Diva（WXDi）':s.startsWith('WX24')?'WX24':s.startsWith('WX25')?'WX25':s.startsWith('WX26')?'WX26':'其他';
const cnt={};R.forEach(r=>cnt[r[1]]=(cnt[r[1]]||0)+1);
let og={};DATA.sets.forEach(s=>{(og[gen(s)]=og[gen(s)]||[]).push(s)});
$('set').innerHTML='<option value="">全部彈數</option>'+Object.entries(og).map(([g,ss])=>`<optgroup label="${g}">`+ss.map(s=>`<option value="${esc(s)}">${esc(s)}（${cnt[s]}）</option>`).join('')+'</optgroup>').join('');
// 種族下拉：依大類分組
const cc={};R.forEach(r=>r[3].split('/').forEach(c=>{c=c.trim();if(c)cc[c]=(cc[c]||0)+1}));
const big=c=>c.includes('：')?c.split('：')[0]:(c.startsWith('奏')?c:'LRIG／其他');
let cg={};Object.keys(cc).sort((a,b)=>cc[b]-cc[a]).forEach(c=>{(cg[big(c)]=cg[big(c)]||[]).push(c)});
const bigOrder=['奏像','奏武','奏械','奏羅','奏生','奏元','LRIG／其他'];
$('cls').innerHTML='<option value="">全部種族</option>'+bigOrder.filter(b=>cg[b]).map(b=>`<optgroup label="${b}">`+(b.startsWith('奏')&&cg[b].length>1?`<option value="大:${b}">${b}（全部）</option>`:'')+cg[b].map(c=>`<option value="${esc(c)}">${esc(c.replace(b+'：',''))}（${cc[c]}）</option>`).join('')+'</optgroup>').join('');
// chips
const colorNames=['白','赤','青','緑','黒','無'];
const st={q:'',set:'',cls:'',colors:new Set(),confs:new Set(),shown:120};
colorNames.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed','false');b.innerHTML=`<i class="pip" style="background:var(${COL[c]})"></i>${c}`;b.onclick=()=>tog(st.colors,c,b);$('colors').appendChild(b)});
['高','中','低'].forEach(c=>{const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed','false');b.textContent=c;b.onclick=()=>tog(st.confs,c,b);$('confs').appendChild(b)});
function tog(set,v,b){set.has(v)?set.delete(v):set.add(v);b.setAttribute('aria-pressed',set.has(v));st.shown=120;render()}
const norm=s=>String(s).toLowerCase().normalize('NFKC');
const hay=R.map(r=>norm([r[0],r[2],r[3],r[6],r[7],r[9],r[10],r[14]].join(' ')));
function filt(){const q=norm(st.q.trim()).split(/\s+/).filter(Boolean);
 return R.filter((r,i)=>{
  if(st.set&&r[1]!==st.set)return false;
  if(st.cls){const cs=r[3].split('/').map(x=>x.trim());if(st.cls.startsWith('大:')){if(!cs.some(c=>c.startsWith(st.cls.slice(2))))return false}else if(!cs.includes(st.cls))return false}
  if(st.colors.size&&!colorsOf(r[4]).some(c=>st.colors.has(c)))return false;
  if(st.confs.size&&!st.confs.has(r[13]))return false;
  return q.every(w=>hay[i].includes(w))})}
function stripe(c){const cs=colorsOf(c);if(!cs.length)return 'var(--c-none)';if(cs.length==1)return `var(${COL[cs[0]]})`;return `linear-gradient(var(${COL[cs[0]]}) 0 50%,var(${COL[cs[1]]}) 50% 100%)`}
function item(r){const body=r[2].startsWith(r[6])&&r[6]?r[2].slice(r[6].length).trim():r[2];
 return `<li><article class="card"><span class="stripe" style="background:${stripe(r[4])}"></span>
 ${r[15]?`<a href="${esc(r[15])}" target="_blank" rel="noopener" aria-label="在官網開啟 ${esc(r[2])} 原圖"><img class="thumb" loading="lazy" alt="${esc(r[2])} 卡圖" src="${esc(r[15])}" onerror="imgFb(this)"></a>`:''}
 <div class="info">
 <div class="head"><div class="name">${r[6]?`<span class="pre">${esc(r[6])}</span>`:''}${esc(body)}</div><span class="conf ${esc(r[13])}">${esc(r[13]||'—')}</span></div>
 <div class="meta"><span class="id">${esc(r[0])}</span><span>Lv${esc(r[5])}</span><span>${esc(r[4])}</span>${r[3].split('/').map(c=>`<span class="cls">${esc(c)}</span>`).join('')}</div>
 <div class="ety">${esc(r[9])}${r[10]?`<span class="orig">${esc(r[10])}</span>`:''}</div>
 <dl class="detail">
 ${r[7]?`<dt>前綴解析</dt><dd>${esc(r[7])}</dd>`:''}${r[8]?`<dt>後綴</dt><dd>${esc(r[8])}</dd>`:''}
 <dt>語言／手法</dt><dd>${esc(r[11]||'—')}・${esc(r[12]||'—')}</dd>
 ${r[14]?`<dt>備註</dt><dd>${esc(r[14])}</dd>`:''}
 </dl></div></article></li>`}
function render(){const f=filt();$('count').textContent=f.length;
 const b={高:0,中:0,低:0};f.forEach(r=>{if(b[r[13]]!=null)b[r[13]]++});$('breakdown').textContent=`高 ${b.高}・中 ${b.中}・低 ${b.低}`;
 $('list').innerHTML=f.slice(0,st.shown).map(item).join('');$('empty').hidden=f.length>0;$('more').hidden=f.length<=st.shown;
 const left=Math.max(0,f.length-st.shown);$('moreBtn').textContent=`再顯示 ${Math.min(120,left)} 張（還有 ${left} 張）`;
 try{localStorage.setItem('signi-f',JSON.stringify({set:st.set,cls:st.cls}))}catch(e){}}
let t;$('q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{st.q=e.target.value;st.shown=120;render()},120)});
$('set').onchange=e=>{st.set=e.target.value;st.shown=120;render()};
$('cls').onchange=e=>{st.cls=e.target.value;st.shown=120;render()};
$('moreBtn').onclick=()=>{const n=filt().length;if(st.shown<n){st.shown=Math.min(n,st.shown+120);render()}};
$('reset').onclick=()=>{st.q='';st.set='';st.cls='';st.colors.clear();st.confs.clear();st.shown=120;$('q').value='';$('set').value='';$('cls').value='';document.querySelectorAll('button.chip').forEach(b=>b.setAttribute('aria-pressed','false'));render()};
try{const s=JSON.parse(localStorage.getItem('signi-f')||'{}');if(s.set&&cnt[s.set]){st.set=s.set;$('set').value=s.set}if(s.cls){st.cls=s.cls;$('cls').value=s.cls;if($('cls').value!==s.cls)st.cls=''}}catch(e){}
render();
</script>
